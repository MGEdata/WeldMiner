[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weldminer"
version = "0.1.0"
description = "Specimen-oriented welding literature extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3", "langgraph>=0.0.20", "langchain-core>=0.1",
  "python-dotenv>=1", "requests>=2.31", "numpy>=1.26", "pandas>=2",
  "openpyxl>=3.1", "Unidecode>=1.3", "beautifulsoup4>=4.12",
  "pymongo>=4.6", "lxml>=5", "fonttools>=4.50", "gensim>=4.3", "scipy>=1.11"
]

[project.optional-dependencies]
qwen = ["langchain-community>=0.0.20", "dashscope>=1.14"]
deepseek = ["langchain-deepseek>=0.1"]
google = ["langchain-google-genai>=1"]
dev = ["build", "twine"]

[project.scripts]
weldminer = "weldminer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
